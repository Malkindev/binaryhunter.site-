    <style>
        /* Deriv app CSS is sized for a 10px root — required. */
        :root { font-size: 62.5%; }

        /* ── HYPRLVX brand tokens ── */
        :root {
            --hlx-purple: %%PRIMARY_COLOR%%;
            --hlx-purple-hi: %%ACCENT_COLOR%%;
            --hlx-purple-lo: %%PRIMARY_COLOR_DARK%%;
            --hlx-glow: #00D2FF;
            --hlx-bg: %%BACKGROUND_COLOR%%;
            --hlx-ink: #e0f2fe;
            --hlx-font: %%FONT_FAMILY%%;
        }

        html, body {
            margin: 0; padding: 0;
            background: var(--hlx-bg);
            color: var(--hlx-ink);
            font-family: var(--hlx-font), system-ui, sans-serif;
        }

        /* ── HYPRLVX THEME OVERRIDES ──────────────────────────────────────────
           The build themes from /api/appwrite/site-settings (primaryColor / …).
           These variable overrides re-skin the remaining Deriv design tokens the
           settings JSON doesn't reach — the sky blue palette. Loss /
           danger stays red because red carries meaning (a loss), not brand. */
        :root, .theme--dark, .theme--light, body {
            --button-primary-default: %%PRIMARY_COLOR%%;
            --button-primary-hover: %%PRIMARY_COLOR_DARK%%;
            --du-brand-red-coral: %%PRIMARY_COLOR%%;
            --du-button-primary-default: %%PRIMARY_COLOR%%;
            --du-button-primary-hover: %%PRIMARY_COLOR_DARK%%;
            --du-button-primary-light-default: rgba(0, 163, 224, 0.14);
            --du-button-primary-light-hover: rgba(0, 163, 224, 0.24);
            --du-button-tertiary-hover: rgba(0, 163, 224, 0.12);
            --du-text-red: %%ACCENT_COLOR%%;
            --du-purchase-main-2: %%PRIMARY_COLOR%%;
            --du-purchase-section-2: %%PRIMARY_COLOR_DARK%%;
            /* danger / loss keep a true red (semantic, not brand) */
            --du-status-danger: #ef4444;
            --du-transparent-danger: #ef444422;
            /* Retint every Deriv blue to the sky blue family */
            --du-color-blue-1: %%PRIMARY_COLOR%%;
            --du-color-blue-2: #38bdf8;
            --du-color-blue-3: #0284c7;
            --du-color-blue-4: #0369a1;
            --du-color-blue-5: #075985;
            --du-color-blue-6: #0c4a6e;
            --du-text-blue: %%ACCENT_COLOR%%;
            --du-text-info: %%ACCENT_COLOR%%;
            --du-status-info: %%PRIMARY_COLOR%%;
            --du-transparent-info: rgba(0, 163, 224, 0.14);
            --du-button-info-default: %%PRIMARY_COLOR%%;
            --du-button-info-hover: #00D2FF;
            --core-color-solid-blue-1: %%PRIMARY_COLOR%%;
            --core-color-solid-blue-2: #00D2FF;
            color-scheme: light;
        }

        /* ── SINGLE BRAND LOCKUP ──────────────────────────────────────────────
           Restyle the build's native header logo (React-owned, so pure CSS — no
           JS injection to get reconciled away): cropped emblem mark (logoUrl) +
           a "Binaryhunter" wordmark, with the "powered by deriv" sub-mark removed. */
        /* Hide the generated "powered by deriv" wordmark (a data: SVG) and any secondary branded duplicate. */
        .logo-holder img[src^="data:"],
        .logo-holder .d-apollo-logo__image--branded,
        .logo-holder img ~ img {
            display: none !important;
        }
        /* The emblem mark (uploaded logoUrl) — size + glow. */
        .logo-holder img:not([src^="data:"]) {
            height: 42px !important; width: auto !important;
            object-fit: contain !important;
            filter: drop-shadow(0 0 8px rgba(0, 163, 224, 0.6));
            transition: transform .3s cubic-bezier(.16,1,.3,1), filter .3s;
        }
        .d-apollo-logo:hover .logo-holder img:not([src^="data:"]) {
            transform: translateY(-1px) scale(1.05);
            filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.95));
        }
        .logo-holder { display: flex !important; align-items: center; gap: 10px; }
        .logo-holder::after {
            content: "%%APP_NAME%%";
            font-family: var(--hlx-font), sans-serif; font-size: 2.6rem; letter-spacing: .03em; line-height: 1;
            color: var(--site-tab-active, var(--hlx-purple-hi)); white-space: nowrap;
            text-shadow: 0 0 10px rgba(0, 163, 224, 0.7), 0 0 22px rgba(0, 210, 255, 0.5);
        }

        /* ── NAVIGATION TABS INTERACTION & RESPONSIVENESS ───────────────────── */
        .dc-tabs__item, [role="tab"], [class*="tabs__item"], [class*="tab-item"], .db-tabs__item {
            cursor: pointer !important;
            user-select: none !important;
            -webkit-user-select: none !important;
            touch-action: manipulation !important;
            color: #0f172a !important;
            -webkit-text-fill-color: #0f172a !important;
            font-weight: 700 !important;
            opacity: 1 !important;
            visibility: visible !important;
            text-shadow: none !important;
        }
        .dc-tabs__item *, [role="tab"] *, [class*="tabs__item"] * {
            pointer-events: none !important;
            color: inherit !important;
            -webkit-text-fill-color: inherit !important;
            font-weight: inherit !important;
            opacity: 1 !important;
            visibility: visible !important;
        }
        .dc-tabs__item--active, .dc-tabs__item.active, [role="tab"][aria-selected="true"], [class*="tabs__item--active"], [class*="tabs__item"][class*="active"] {
            color: #020617 !important;
            -webkit-text-fill-color: #020617 !important;
            font-weight: 800 !important;
        }

        /* ── LOADERS / SPINNERS → purple (D-Trader, charts, page loaders) ── */
        .barspinner .rect, .dc-loading .rect, .initial-loader .rect,
        [class*="barspinner"] [class*="rect"] { background-color: var(--hlx-purple-hi) !important; }
        [class*="loader"] svg circle[stroke]:not([stroke="none"]),
        [class*="spinner"] svg circle[stroke]:not([stroke="none"]) { stroke: var(--hlx-purple-hi) !important; }
        .dc-loading, [class*="loading__"] path[fill]:not([fill="none"]) { color: var(--hlx-purple-hi) !important; }

        /* Analysis embed (api.binarytool.site) is cross-origin */
        .iframe-switcher iframe, iframe[src*="binarytool"] { filter: none; }

        /* Tradingview / Trading-grid toggle buttons → theme sky blue (were hard blue) */
        [class*="chart"] button[class*="active"], .smartcharts button.active { background: var(--hlx-purple) !important; }

        /* ── LIFE: shimmer, glow, hover, reflection ───────────────────────────
           Purposeful motion (the site should feel alive). Everything degrades to
           a static state under prefers-reduced-motion. */

        /* smooth base transitions on interactive chrome */
        .dc-btn, .auth-actions button, [role="tab"], .dc-tabs__item,
        .bot-card, [class*="bot-list__card"], [class*="quick-strategy"] [class*="card"] {
            transition: transform .28s cubic-bezier(.16,1,.3,1),
                        box-shadow .28s cubic-bezier(.16,1,.3,1),
                        filter .28s cubic-bezier(.16,1,.3,1) !important;
        }

        /* primary buttons: lift + sky blue glow + a light sheen that sweeps across */
        .dc-btn--primary, .auth-actions__primary, button[class*="--primary"] {
            position: relative; overflow: hidden;
        }
        .dc-btn--primary::after, .auth-actions__primary::after,
        button[class*="--primary"]::after {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.28) 50%, transparent 70%);
            transform: translateX(-120%); pointer-events: none;
        }
        .dc-btn--primary:hover, .auth-actions__primary:hover,
        button[class*="--primary"]:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(0, 163, 224, 0.45), 0 0 0 1px rgba(0, 210, 255, 0.35) inset;
        }
        .dc-btn--primary:hover::after, .auth-actions__primary:hover::after,
        button[class*="--primary"]:hover::after {
            animation: hlx-sheen .8s cubic-bezier(.16,1,.3,1);
        }
        @keyframes hlx-sheen { to { transform: translateX(120%); } }

        /* cards: lift + glow + a faint top reflection */
        .bot-card:hover, [class*="bot-list__card"]:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 40px rgba(0, 163, 224, 0.28), 0 0 0 1px rgba(0, 210, 255, 0.25);
        }

        /* tabs: active/hover glow */
        [role="tab"]:hover, .dc-tabs__item:hover { filter: drop-shadow(0 0 6px rgba(0, 163, 224, 0.5)); }

        @keyframes hlx-aura { 0%,100%{opacity:.5} 50%{opacity:.9} }

        @media (prefers-reduced-motion: reduce) {
            *, ::after, ::before { animation: none !important; transition: none !important; }
        }

        /* ── CUSTOMER LOADER BACKGROUND WITH EMBLEM ── */
        .loaderx-root, .initial-loader, #hlx-loader, [class*="loaderx-root"] {
            background-color: #030813 !important;
            background-image: 
                radial-gradient(circle at center, rgba(0, 163, 224, 0.22) 0%, rgba(3, 8, 19, 0.75) 60%, rgba(2, 6, 14, 0.94) 100%),
                url("/assets/media/logo.png") !important;
            background-repeat: no-repeat !important;
            background-position: center center !important;
            background-size: min(85vw, 680px) auto !important;
        }
        .loaderx__panel, .loaderx__terminal, .loaderx__rings-card, [class*="loaderx__"] {
            background: rgba(3, 10, 22, 0.78) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(0, 163, 224, 0.35) !important;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.75), 0 0 35px rgba(0, 163, 224, 0.25) !important;
            border-radius: 16px !important;
        }
    
        .landing-v2{position:fixed;inset:0;z-index:99999;overflow-y:auto;color:#f8fbff;background:#060b17;min-height:100vh;font-family:Inter,Segoe UI,sans-serif;overflow-x:hidden}

        .landing-v2__market-strip em{color:#ef4444;margin-left:.4rem;font-style:normal;font-weight:700}

        /* ── Hero Section ── */
