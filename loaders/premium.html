<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060810;overflow:hidden;font-family:'IBM Plex Sans',monospace,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;width:100vw}

/* Grid background */
body::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(204,0,0,.04)1px,transparent 1px),linear-gradient(90deg,rgba(204,0,0,.04)1px,transparent 1px);background-size:48px 48px;animation:gridpulse 4s ease-in-out infinite}
@keyframes gridpulse{0%,100%{opacity:.4}50%{opacity:1}}

/* Particle overlay */
canvas{position:absolute;inset:0;pointer-events:none}

.center{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;z-index:10}

/* Outer rings */
.ring{position:absolute;border-radius:50%;border:1px solid rgba(204,0,0,.3);animation:ripple 3s ease-out infinite}
.ring-1{width:220px;height:220px;animation-delay:0s}
.ring-2{width:300px;height:300px;animation-delay:.7s;border-color:rgba(204,0,0,.2)}
.ring-3{width:400px;height:400px;animation-delay:1.4s;border-color:rgba(204,0,0,.1)}
@keyframes ripple{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.2);opacity:0}}

/* Logo container */
.logo-wrap{position:relative;width:100px;height:100px;margin-bottom:28px}
.logo-glow{position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,rgba(204,0,0,.5)0%,transparent 70%);animation:glowpulse 2s ease-in-out infinite}
@keyframes glowpulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
.logo-img{width:100px;height:100px;object-fit:cover;border-radius:16px;border:2px solid rgba(204,0,0,.6);box-shadow:0 0 40px rgba(204,0,0,.5),0 0 80px rgba(204,0,0,.2);position:relative;z-index:2;animation:logobob 3s ease-in-out infinite}
@keyframes logobob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* Brand text */
.brand{display:flex;gap:0;margin-bottom:6px}
.brand span{font-size:38px;font-weight:900;letter-spacing:6px;color:#fff;text-shadow:0 0 20px rgba(204,0,0,.8);animation:letterIn .6s cubic-bezier(.34,1.56,.64,1) both}
.brand span:nth-child(1){animation-delay:.1s}
.brand span:nth-child(2){animation-delay:.18s}
.brand span:nth-child(3){animation-delay:.26s}
.brand span:nth-child(4){animation-delay:.34s}
.brand span:nth-child(5){animation-delay:.42s}
.brand span:nth-child(6){animation-delay:.50s}
.brand span:nth-child(7){animation-delay:.58s}
@keyframes letterIn{0%{opacity:0;transform:translateY(20px) scale(.5)}100%{opacity:1;transform:translateY(0) scale(1)}}

.tagline{font-size:11px;letter-spacing:8px;color:#cc0000;font-weight:700;text-transform:uppercase;margin-bottom:36px;opacity:0;animation:fadein .5s .8s forwards}
@keyframes fadein{to{opacity:1}}

/* Bars animation */
.bars{display:flex;gap:5px;align-items:flex-end;height:44px;margin-bottom:28px;opacity:0;animation:fadein .5s .9s forwards}
.bars span{width:7px;border-radius:3px 3px 0 0;background:linear-gradient(to top,#800000,#cc0000);animation:barwave 1.2s ease-in-out infinite}
.bars span:nth-child(1){animation-delay:0s;height:16px}
.bars span:nth-child(2){animation-delay:.1s;height:26px}
.bars span:nth-child(3){animation-delay:.2s;height:40px}
.bars span:nth-child(4){animation-delay:.3s;height:32px}
.bars span:nth-child(5){animation-delay:.4s;height:44px;background:linear-gradient(to top,#cc0000,#ff4444)}
.bars span:nth-child(6){animation-delay:.5s;height:30px}
.bars span:nth-child(7){animation-delay:.6s;height:22px}
.bars span:nth-child(8){animation-delay:.7s;height:36px}
.bars span:nth-child(9){animation-delay:.3s;height:28px;background:linear-gradient(to top,#006600,#22c55e)}
.bars span:nth-child(10){animation-delay:.15s;height:20px;background:linear-gradient(to top,#006600,#22c55e)}
.bars span:nth-child(11){animation-delay:.45s;height:38px;background:linear-gradient(to top,#006600,#22c55e)}
.bars span:nth-child(12){animation-delay:.25s;height:24px}
@keyframes barwave{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}

/* Progress */
.progress-track{width:280px;height:2px;background:rgba(255,255,255,.08);border-radius:1px;overflow:hidden;margin-bottom:12px;opacity:0;animation:fadein .4s 1s forwards}
.progress-fill{height:100%;background:linear-gradient(90deg,#800000,#cc0000,#ff4444);border-radius:1px;width:0%;transition:width .4s ease;box-shadow:0 0 8px #cc0000}

.status{font-size:11px;letter-spacing:2px;color:rgba(255,255,255,.4);text-transform:uppercase;opacity:0;animation:fadein .4s 1.1s forwards;min-height:16px}

/* Bottom tickers */
.tickers{position:absolute;bottom:28px;left:0;right:0;display:flex;justify-content:center;gap:32px;opacity:0;animation:fadein .5s 1.2s forwards}
.tick{font-size:11px;letter-spacing:1px;color:rgba(255,255,255,.35);display:flex;gap:8px;align-items:center}
.tick .sym{color:rgba(255,255,255,.6);font-weight:700}
.tick .up{color:#22c55e}
.tick .dn{color:#cc0000}

/* Version badge */
.ver{position:absolute;top:20px;right:24px;font-size:10px;letter-spacing:2px;color:rgba(204,0,0,.5);font-weight:600;text-transform:uppercase;opacity:0;animation:fadein .5s 1.3s forwards}

/* Deriv powered */
.powered{position:absolute;bottom:10px;right:18px;font-size:9px;letter-spacing:1px;color:rgba(255,255,255,.15);opacity:0;animation:fadein .5s 1.5s forwards}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ring ring-1"></div>
<div class="ring ring-2"></div>
<div class="ring ring-3"></div>

<div class="center">
  <div class="logo-wrap">
    <div class="logo-glow"></div>
    <img id="loaderLogo" class="logo-img" alt="HYPRLVX" onerror="this.style.display='none'">
  </div>

  <div class="brand">
    <span>H</span><span>Y</span><span>P</span><span>R</span><span>L</span><span>V</span><span>X</span>
  </div>
  <div class="tagline" id="loaderTagline"></div>

  <div class="bars">
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="progress-track">
    <div class="progress-fill" id="loaderBar"></div>
  </div>
  <div class="status" id="loaderMsg">Initializing markets...</div>
</div>

<div class="tickers" id="loaderTickers"></div>
<div class="ver">v2.0 ALPHA</div>
<div class="powered">Powered by Deriv</div>

<script>
// Particle canvas
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
const pts = Array.from({length:60},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*2+.5,a:Math.random()}));
function drawParticles(){ctx.clearRect(0,0,canvas.width,canvas.height);pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(204,0,0,${p.a*.4})`;ctx.fill();pts.forEach(q=>{const dx=p.x-q.x,dy=p.y-q.y,d=Math.sqrt(dx*dx+dy*dy);if(d<120){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle=`rgba(204,0,0,${(1-d/120)*.08})`;ctx.stroke()}})});requestAnimationFrame(drawParticles)}
drawParticles();

// Progress
const msgs=['Scanning market liquidity...','Connecting to Deriv API...','Analyzing price feeds...','Loading bot strategies...','Initializing risk engine...','Preparing execution layer...','Almost ready...'];
let p=0,mi=0;
const bar=document.getElementById('loaderBar'),msg=document.getElementById('loaderMsg');
const iv=setInterval(()=>{p=Math.min(p+Math.random()*14+4,100);if(bar)bar.style.width=p+'%';if(msg&&mi<msgs.length)msg.textContent=msgs[mi++]},380);
setTimeout(()=>clearInterval(iv),3800);

// Tickers
const pairs=[['BTC/USD','43,821','up','+2.4%'],['EUR/USD','1.0821','dn','-0.3%'],['BOOM 1000','9,248','up','+1.1%'],['CRASH 500','5,012','dn','-0.8%'],['VOL 75','74.3','up','+0.5%']];
const tickEl=document.getElementById('loaderTickers');
if(tickEl)tickEl.innerHTML=pairs.map(([s,v,d,c])=>`<div class="tick"><span class="sym">${s}</span><span>${v}</span><span class="${d}">${c}</span></div>`).join('');
</script>
</body>
</html>
