<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #060a12;
        font-family: monospace;
        color: #e2e8f0;
        overflow: hidden;
    }

    /* grid background */

    body::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(rgba(0, 255, 200, .05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 200, .05) 1px, transparent 1px);
        background-size: 40px 40px;
        opacity: .2;
    }

    /* card */

    .loader {
        width: 440px;
        padding: 40px;
        background: rgba(10, 18, 30, .85);
        border-radius: 14px;
        border: 1px solid rgba(0, 255, 200, .2);
        box-shadow: 0 0 35px rgba(0, 255, 200, .1);
        text-align: center;
    }

    /* logo */

    .logo {
        width: 70px;
        height: 70px;
        margin: auto;
        margin-bottom: 10px;
    }

    .logo img {
        width: 100%;
        animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
        0% {
            transform: translateY(0)
        }
        50% {
            transform: translateY(-8px)
        }
        100% {
            transform: translateY(0)
        }
    }

    .site {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 2px;
    }

    .tagline {
        font-size: 12px;
        opacity: .6;
        margin-bottom: 30px;
    }

    /* candlestick chart */

    .chart {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 10px;
        height: 80px;
        margin: 25px 0;
    }

    .candle {
        width: 10px;
        border-radius: 3px;
        animation: move 1.2s infinite ease-in-out;
    }

    .green {
        background: #22c55e;
    }

    .red {
        background: #ef4444;
    }

    .candle:nth-child(1) {
        height: 30px;
        animation-delay: .1s
    }

    .candle:nth-child(2) {
        height: 55px;
        animation-delay: .2s
    }

    .candle:nth-child(3) {
        height: 40px;
        animation-delay: .3s
    }

    .candle:nth-child(4) {
        height: 65px;
        animation-delay: .4s
    }

    .candle:nth-child(5) {
        height: 35px;
        animation-delay: .5s
    }

    .candle:nth-child(6) {
        height: 60px;
        animation-delay: .6s
    }

    @keyframes move {
        0%,
        100% {
            transform: scaleY(1)
        }
        50% {
            transform: scaleY(1.5)
        }
    }

    /* scan line */

    .scan {
        position: relative;
        height: 2px;
        background: #022;
        margin: 25px 0;
        overflow: hidden;
    }

    .scan::after {
        content: "";
        position: absolute;
        height: 100%;
        width: 60px;
        background: linear-gradient(90deg, transparent, #00ffd0, transparent);
        animation: scan 2s linear infinite;
    }

    @keyframes scan {
        0% {
            left: -60px
        }
        100% {
            left: 100%
        }
    }

    /* progress */

    .progress {
        height: 6px;
        background: #022;
        border-radius: 10px;
        overflow: hidden;
    }

    .bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #00ffc3, #22c55e);
        box-shadow: 0 0 10px #00ffc3;
    }

    .message {
        margin-top: 15px;
        font-size: 12px;
        opacity: .8;
    }
</style>

<div class="loader">

    <div class="logo">
        <img id="loaderLogo">
    </div>

    <div class="site" id="loaderName"></div>
    <div class="tagline" id="loaderTagline"></div>

    <!-- Candlestick chart -->
    <div class="chart">
        <div class="candle green"></div>
        <div class="candle red"></div>
        <div class="candle green"></div>
        <div class="candle red"></div>
        <div class="candle green"></div>
        <div class="candle green"></div>
    </div>

    <div class="scan"></div>

    <div class="progress">
        <div class="bar" id="progressBar"></div>
    </div>

    <div class="message" id="loaderMsg">
        Scanning market liquidity...
    </div>

</div>

<script>
    const messages = [
        "Connecting to Deriv market feed...",
        "Scanning volatility clusters...",
        "Analyzing price movement...",
        "Evaluating bot strategies...",
        "Optimizing risk algorithms...",
        "Preparing smart execution..."
    ];

    let progress = 0;
    let msgIndex = 0;

    const bar = document.getElementById("progressBar");
    const msg = document.getElementById("loaderMsg");

    setInterval(() => {

        progress += Math.random() * 8;
        if (progress > 100) progress = 100;

        bar.style.width = progress + "%";

        msg.innerText = messages[msgIndex];
        msgIndex = (msgIndex + 1) % messages.length;

    }, 450);
</script>
