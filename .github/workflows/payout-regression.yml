name: Payout regression tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  payout-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run payout regression tests
        run: npm test
